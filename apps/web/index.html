<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/api/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141516" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Crewhall</title>
    <script>
      // Apply the stored appearance before first paint to avoid a light flash in dark mode.
      try {
        var a = localStorage.getItem('crewhall.appearance') || 'system';
        var d =
          a === 'dark' || (a === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = d ? 'dark' : 'light';
        var css = localStorage.getItem('crewhall.themeCss');
        if (css) {
          var s = document.createElement('style');
          s.id = 'crewhall-org-theme';
          s.textContent = css;
          document.head.appendChild(s);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
